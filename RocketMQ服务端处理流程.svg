<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1380" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FAFC"/><stop offset="1" stop-color="#E9F0F6"/>
    </linearGradient>

    <linearGradient id="gNet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3F2FD"/><stop offset="1" stop-color="#BBDEFB"/>
    </linearGradient>
    <linearGradient id="gDisp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3E5F5"/><stop offset="1" stop-color="#E1BEE7"/>
    </linearGradient>
    <linearGradient id="gProc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3E0"/><stop offset="1" stop-color="#FFCC80"/>
    </linearGradient>
    <linearGradient id="gMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8F5E9"/><stop offset="1" stop-color="#A5D6A7"/>
    </linearGradient>
    <linearGradient id="gHook" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDE7"/><stop offset="1" stop-color="#FFF59D"/>
    </linearGradient>
    <linearGradient id="gStore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ECEFF1"/><stop offset="1" stop-color="#CFD8DC"/>
    </linearGradient>
    <linearGradient id="gResp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0F7F4"/><stop offset="1" stop-color="#B2DFDB"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#37474F" flood-opacity="0.18"/>
    </filter>

    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#34495E"/>
    </marker>
    <marker id="arrG" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1E8449"/>
    </marker>
    <marker id="arrO" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#B9770E"/>
    </marker>
    <marker id="arrS" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#5D6D7E"/>
    </marker>
  </defs>

  <rect width="1280" height="1380" fill="url(#bg)"/>

  <!-- 标题 -->
  <text x="640" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#2C3E50">RocketMQ 服务端请求处理流程图</text>
  <text x="640" y="72" text-anchor="middle" font-size="13" fill="#7B8794">Broker (NettyRemotingServer) · RemotingCommand 解码 → Processor 路由 → SendMessageProcessor → CommitLog 落盘 → 响应</text>

  <!-- 左侧阶段标签 -->
  <g font-size="11" font-weight="700" fill="#85929E" letter-spacing="2">
    <rect x="40" y="110" width="1200" height="56" rx="6" fill="#FFFFFF" stroke="#D5DBDB" stroke-dasharray="3 4" opacity="0.6"/>
    <text x="58" y="144">① 网络入口 · Netty Network Layer</text>

    <rect x="40" y="190" width="1200" height="80" rx="6" fill="#FFFFFF" stroke="#D5DBDB" stroke-dasharray="3 4" opacity="0.6"/>
    <text x="58" y="234">② 解码与分发 · Decode &amp; Dispatch</text>

    <rect x="40" y="294" width="1200" height="140" rx="6" fill="#FFFFFF" stroke="#D5DBDB" stroke-dasharray="3 4" opacity="0.6"/>
    <text x="58" y="372">③ Processor 路由 · processorTable</text>

    <rect x="40" y="464" width="1200" height="680" rx="6" fill="#FFFFFF" stroke="#D5DBDB" stroke-dasharray="3 4" opacity="0.6"/>
    <text x="58" y="488">④ SendMessageProcessor 主流程 · 核心写入链路</text>

    <rect x="40" y="1174" width="1200" height="80" rx="6" fill="#FFFFFF" stroke="#D5DBDB" stroke-dasharray="3 4" opacity="0.6"/>
    <text x="58" y="1218">⑤ 响应返回 · Response</text>
  </g>

  <!-- ============= ① 网络入口 ============= -->
  <g filter="url(#shadow)">
    <path d="M 460 110 L 820 110 L 820 158 L 540 158 L 520 166 L 540 158 L 460 158 Z" fill="url(#gNet)" stroke="#2980B9" stroke-width="2"/>
    <text x="640" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1B4F72">客户端请求 · RemotingCommand</text>
    <text x="640" y="154" text-anchor="middle" font-size="11" fill="#21618C">requestCode + body + extFields (TCP/Netty)</text>
  </g>

  <!-- ============= ② 解码分发 ============= -->
  <g filter="url(#shadow)">
    <rect x="460" y="206" width="360" height="56" rx="10" fill="url(#gNet)" stroke="#2980B9" stroke-width="2"/>
    <text x="640" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#1B4F72">NettyRemotingServer · NettyDecoder</text>
    <text x="640" y="247" text-anchor="middle" font-size="11" fill="#21618C" font-style="italic">NettyServerHandler.channelRead0</text>
  </g>
  <path d="M 640 166 L 640 206" fill="none" stroke="#34495E" stroke-width="2" marker-end="url(#arr)"/>

  <g filter="url(#shadow)">
    <rect x="460" y="282" width="360" height="56" rx="10" fill="url(#gDisp)" stroke="#8E44AD" stroke-width="2"/>
    <text x="640" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#4A235A">RemotingAbstract.processMessageReceived</text>
    <text x="640" y="323" text-anchor="middle" font-size="11" fill="#6C3483" font-style="italic">按 requestCode 查 processorTable 路由</text>
  </g>
  <path d="M 640 262 L 640 282" fill="none" stroke="#34495E" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============= ③ Processor 路由 (多分支) ============= -->
  <g filter="url(#shadow)">
    <path d="M 640 360 L 740 410 L 640 460 L 540 410 Z" fill="url(#gDisp)" stroke="#8E44AD" stroke-width="2"/>
    <text x="640" y="406" text-anchor="middle" font-size="12" font-weight="700" fill="#4A235A">requestCode</text>
    <text x="640" y="424" text-anchor="middle" font-size="11" fill="#6C3483">match Processor</text>
  </g>
  <path d="M 640 338 L 640 360" fill="none" stroke="#34495E" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 5 个 Processor 并列 -->
  <g filter="url(#shadow)">
    <rect x="80" y="494" width="180" height="70" rx="10" fill="url(#gProc)" stroke="#E67E22" stroke-width="2"/>
    <text x="170" y="520" text-anchor="middle" font-size="13" font-weight="700" fill="#7E5109">SendMessage</text>
    <text x="170" y="538" text-anchor="middle" font-size="11" fill="#B9770E">Processor</text>
    <text x="170" y="554" text-anchor="middle" font-size="10" fill="#CA6F1E" font-style="italic">SEND_MSG · 10</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="285" y="494" width="180" height="70" rx="10" fill="url(#gProc)" stroke="#E67E22" stroke-width="2"/>
    <text x="375" y="520" text-anchor="middle" font-size="13" font-weight="700" fill="#7E5109">PullMessage</text>
    <text x="375" y="538" text-anchor="middle" font-size="11" fill="#B9770E">Processor</text>
    <text x="375" y="554" text-anchor="middle" font-size="10" fill="#CA6F1E" font-style="italic">PULL_MSG · 11</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="490" y="494" width="180" height="70" rx="10" fill="url(#gProc)" stroke="#E67E22" stroke-width="2"/>
    <text x="580" y="520" text-anchor="middle" font-size="13" font-weight="700" fill="#7E5109">PopMessage</text>
    <text x="580" y="538" text-anchor="middle" font-size="11" fill="#B9770E">Processor</text>
    <text x="580" y="554" text-anchor="middle" font-size="10" fill="#CA6F1E" font-style="italic">POP_MSG · 200050</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="695" y="494" width="180" height="70" rx="10" fill="url(#gProc)" stroke="#E67E22" stroke-width="2"/>
    <text x="785" y="520" text-anchor="middle" font-size="13" font-weight="700" fill="#7E5109">EndTransaction</text>
    <text x="785" y="538" text-anchor="middle" font-size="11" fill="#B9770E">Processor</text>
    <text x="785" y="554" text-anchor="middle" font-size="10" fill="#CA6F1E" font-style="italic">END_TX · 37</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="900" y="494" width="220" height="70" rx="10" fill="url(#gProc)" stroke="#E67E22" stroke-width="2"/>
    <text x="1010" y="520" text-anchor="middle" font-size="13" font-weight="700" fill="#7E5109">AckMessage · Heartbeat</text>
    <text x="1010" y="538" text-anchor="middle" font-size="11" fill="#B9770E">Processor</text>
    <text x="1010" y="554" text-anchor="middle" font-size="10" fill="#CA6F1E" font-style="italic">ACK · HEART_BEAT · QueryConsumer</text>
  </g>

  <!-- 菱形到 Processor 的连线 -->
  <path d="M 560 410 C 350 440, 230 460, 170 494" fill="none" stroke="#B9770E" stroke-width="1.8" marker-end="url(#arrO)"/>
  <path d="M 600 410 C 460 440, 400 460, 375 494" fill="none" stroke="#B9770E" stroke-width="1.8" marker-end="url(#arrO)"/>
  <path d="M 640 460 L 580 494" fill="none" stroke="#B9770E" stroke-width="2" marker-end="url(#arrO)"/>
  <path d="M 680 410 C 740 440, 770 460, 785 494" fill="none" stroke="#B9770E" stroke-width="1.8" marker-end="url(#arrO)"/>
  <path d="M 720 410 C 880 440, 980 460, 1010 494" fill="none" stroke="#B9770E" stroke-width="1.8" marker-end="url(#arrO)"/>

  <!-- ============= ④ SendMessageProcessor 主流程 ============= -->
  <path d="M 170 564 C 170 600, 200 620, 240 624" fill="none" stroke="#1E8449" stroke-width="2.5" marker-end="url(#arrG)"/>

  <g filter="url(#shadow)">
    <rect x="240" y="606" width="800" height="50" rx="10" fill="url(#gMain)" stroke="#1E8449" stroke-width="2"/>
    <text x="640" y="628" text-anchor="middle" font-size="13" font-weight="700" fill="#145A32">SendMessageProcessor.processRequest()  →  sendMessage()</text>
    <text x="640" y="646" text-anchor="middle" font-size="10" fill="#196F3D" font-style="italic">isAsyncSendEnable · CompletableFuture 异步化</text>
  </g>

  <path d="M 640 656 L 640 676" fill="none" stroke="#34495E" stroke-width="2" marker-end="url(#arr)"/>

  <!-- msgCheck 菱形 -->
  <g filter="url(#shadow)">
    <path d="M 640 676 L 760 720 L 640 764 L 520 720 Z" fill="url(#gMain)" stroke="#1E8449" stroke-width="2"/>
    <text x="640" y="716" text-anchor="middle" font-size="12" font-weight="700" fill="#145A32">msgCheck</text>
    <text x="640" y="734" text-anchor="middle" font-size="10" fill="#196F3D">TopicConfig · SubscriptionGroup</text>
    <text x="640" y="748" text-anchor="middle" font-size="10" fill="#196F3D">权限 / Perm / LMQ 校验</text>
  </g>

  <!-- 校验失败分支 -->
  <path d="M 760 720 C 900 720, 1080 760, 1110 820" fill="none" stroke="#C0392B" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="930" y="700" font-size="11" fill="#C0392B" font-weight="600">校验失败</text>
  <text x="930" y="714" font-size="10" fill="#A93226">直接返回错误码</text>

  <path d="M 640 764 L 640 790" fill="none" stroke="#34495E" stroke-width="2" marker-end="url(#arr)"/>

  <!-- PutMessageHook 链 -->
  <g filter="url(#shadow)">
    <rect x="280" y="790" width="720" height="56" rx="10" fill="url(#gHook)" stroke="#F39C12" stroke-width="2"/>
    <text x="640" y="812" text-anchor="middle" font-size="13" font-weight="700" fill="#7D6608">PutMessageHook 链  (BrokerController:1030 注册)</text>
    <text x="640" y="832" text-anchor="middle" font-size="10" fill="#9A7D0A" font-style="italic">DefaultMessageStore.asyncPutMessage:645 写 CommitLog 前执行</text>
  </g>

  <!-- 4 个 Hook 子卡片 -->
  <g filter="url(#shadow)">
    <rect x="200" y="876" width="200" height="60" rx="8" fill="url(#gHook)" stroke="#F39C12" stroke-width="1.5"/>
    <text x="300" y="898" text-anchor="middle" font-size="12" font-weight="700" fill="#7D6608">checkBeforePutMessage</text>
    <text x="300" y="914" text-anchor="middle" font-size="10" fill="#9A7D0A">基础合法性校验</text>
    <text x="300" y="928" text-anchor="middle" font-size="9" fill="#B7950B" font-style="italic">body / topic / app</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="420" y="876" width="200" height="60" rx="8" fill="url(#gHook)" stroke="#F39C12" stroke-width="1.5"/>
    <text x="520" y="898" text-anchor="middle" font-size="12" font-weight="700" fill="#7D6608">innerBatchChecker</text>
    <text x="520" y="914" text-anchor="middle" font-size="10" fill="#9A7D0A">内部批量校验</text>
    <text x="520" y="928" text-anchor="middle" font-size="9" fill="#B7950B" font-style="italic">Batch / LMQ</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="640" y="876" width="200" height="60" rx="8" fill="url(#gHook)" stroke="#F39C12" stroke-width="1.5"/>
    <text x="740" y="898" text-anchor="middle" font-size="12" font-weight="700" fill="#7D6608">handleScheduleMessage</text>
    <text x="740" y="914" text-anchor="middle" font-size="10" fill="#9A7D0A">延迟/定时路由</text>
    <text x="740" y="928" text-anchor="middle" font-size="9" fill="#B7950B" font-style="italic">4.x→SCHEDULE / 5.x→TIMER</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="860" y="876" width="200" height="60" rx="8" fill="url(#gHook)" stroke="#F39C12" stroke-width="1.5"/>
    <text x="960" y="898" text-anchor="middle" font-size="12" font-weight="700" fill="#7D6608">handleLmqQuota</text>
    <text x="960" y="914" text-anchor="middle" font-size="10" fill="#9A7D0A">LMQ 配额</text>
    <text x="960" y="928" text-anchor="middle" font-size="9" fill="#B7950B" font-style="italic">轻量队列限流</text>
  </g>

  <!-- Hook 链到 4 子卡片连线 -->
  <path d="M 640 846 L 640 858 L 300 858 L 300 876" fill="none" stroke="#F39C12" stroke-width="1.8"/>
  <path d="M 640 846 L 640 858 L 520 858 L 520 876" fill="none" stroke="#F39C12" stroke-width="1.8"/>
  <path d="M 640 846 L 640 876" fill="none" stroke="#F39C12" stroke-width="1.8"/>
  <path d="M 640 846 L 640 858 L 960 858 L 960 876" fill="none" stroke="#F39C12" stroke-width="1.8"/>

  <!-- 子卡片汇合到 store -->
  <path d="M 640 936 L 640 962" fill="none" stroke="#34495E" stroke-width="2" marker-end="url(#arr)"/>

  <!-- DefaultMessageStore -->
  <g filter="url(#shadow)">
    <rect x="240" y="962" width="800" height="56" rx="10" fill="url(#gMain)" stroke="#1E8449" stroke-width="2"/>
    <text x="640" y="984" text-anchor="middle" font-size="13" font-weight="700" fill="#145A32">DefaultMessageStore.asyncPutMessage()</text>
    <text x="640" y="1004" text-anchor="middle" font-size="10" fill="#196F3D" font-style="italic">异步存储入口 · 检查 storeStatus / 磁盘 / HA role</text>
  </g>
  <path d="M 640 1018 L 640 1038" fill="none" stroke="#34495E" stroke-width="2" marker-end="url(#arr)"/>

  <!-- CommitLog -->
  <g filter="url(#shadow)">
    <rect x="240" y="1038" width="800" height="56" rx="10" fill="url(#gStore)" stroke="#566573" stroke-width="2"/>
    <text x="640" y="1060" text-anchor="middle" font-size="13" font-weight="700" fill="#2C3E50">CommitLog.asyncPutMessage()  →  MappedFile.appendMessage</text>
    <text x="640" y="1080" text-anchor="middle" font-size="10" fill="#5D6D7E" font-style="italic">topicQueueLock + putMessageLock · 顺序写 mmap</text>
  </g>

  <!-- dispatch 分支 -->
  <path d="M 640 1094 L 640 1112" fill="none" stroke="#34495E" stroke-width="2"/>
  <path d="M 640 1112 L 420 1130" fill="none" stroke="#5D6D7E" stroke-width="1.8" marker-end="url(#arrS)"/>
  <path d="M 640 1112 L 860 1130" fill="none" stroke="#5D6D7E" stroke-width="1.8" marker-end="url(#arrS)"/>

  <g filter="url(#shadow)">
    <rect x="220" y="1130" width="220" height="46" rx="8" fill="url(#gStore)" stroke="#566573" stroke-width="1.5"/>
    <text x="330" y="1152" text-anchor="middle" font-size="12" font-weight="700" fill="#2C3E50">ConsumeQueue (dispatch)</text>
    <text x="330" y="1168" text-anchor="middle" font-size="10" fill="#5D6D7E" font-style="italic">ReputMessageService · 20B/项</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="700" y="1130" width="220" height="46" rx="8" fill="url(#gStore)" stroke="#566573" stroke-width="1.5"/>
    <text x="810" y="1152" text-anchor="middle" font-size="12" font-weight="700" fill="#2C3E50">IndexFile (dispatch)</text>
    <text x="810" y="1168" text-anchor="middle" font-size="10" fill="#5D6D7E" font-style="italic">topicKey · uniqKey · 哈希索引</text>
  </g>

  <!-- 汇合到响应 -->
  <path d="M 330 1176 C 330 1190, 460 1200, 540 1206" fill="none" stroke="#16A085" stroke-width="2" marker-end="url(#arrG)"/>
  <path d="M 810 1176 C 810 1190, 780 1200, 740 1206" fill="none" stroke="#16A085" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- 校验失败分支汇入响应 (虚线) -->
  <path d="M 1110 820 C 1110 1080, 900 1200, 740 1216" fill="none" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrG)"/>

  <!-- ============= ⑤ 响应返回 ============= -->
  <g filter="url(#shadow)">
    <rect x="380" y="1206" width="520" height="48" rx="10" fill="url(#gResp)" stroke="#16A085" stroke-width="2"/>
    <text x="640" y="1228" text-anchor="middle" font-size="13" font-weight="700" fill="#0B5345">handlePutMessageResultFuture  →  返回 Response</text>
    <text x="640" y="1245" text-anchor="middle" font-size="10" fill="#117864" font-style="italic">SEND_OK · FLUSH_DISK_TIMEOUT · FLUSH_SLAVE_TIMEOUT · SLAVE_NOT_AVAILABLE</text>
  </g>

  <path d="M 640 1254 L 640 1276" fill="none" stroke="#34495E" stroke-width="2" marker-end="url(#arr)"/>

  <g filter="url(#shadow)">
    <path d="M 460 1276 L 820 1276 L 820 1324 L 540 1324 L 520 1332 L 540 1324 L 460 1324 Z" fill="url(#gResp)" stroke="#16A085" stroke-width="2"/>
    <text x="640" y="1304" text-anchor="middle" font-size="14" font-weight="700" fill="#0B5345">响应客户端 · RemotingCommand response</text>
    <text x="640" y="1320" text-anchor="middle" font-size="11" fill="#117864" font-style="italic">Netty channel.writeAndFlush</text>
  </g>

  <!-- 图例 -->
  <g>
    <rect x="1140" y="606" width="120" height="180" rx="8" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="1"/>
    <text x="1200" y="624" text-anchor="middle" font-size="11" font-weight="700" fill="#34495E">图例</text>

    <line x1="1152" y1="640" x2="1188" y2="640" stroke="#34495E" stroke-width="2" marker-end="url(#arr)"/>
    <text x="1192" y="644" font-size="10" fill="#34495E">主流程</text>

    <line x1="1152" y1="660" x2="1188" y2="660" stroke="#1E8449" stroke-width="2" marker-end="url(#arrG)"/>
    <text x="1192" y="664" font-size="10" fill="#1E8449">写入链路</text>

    <line x1="1152" y1="680" x2="1188" y2="680" stroke="#B9770E" stroke-width="1.8" marker-end="url(#arrO)"/>
    <text x="1192" y="684" font-size="10" fill="#B9770E">Processor 分支</text>

    <line x1="1152" y1="700" x2="1188" y2="700" stroke="#F39C12" stroke-width="1.8"/>
    <text x="1192" y="704" font-size="10" fill="#7D6608">Hook 子链</text>

    <line x1="1152" y1="720" x2="1188" y2="720" stroke="#5D6D7E" stroke-width="1.8" marker-end="url(#arrS)"/>
    <text x="1192" y="724" font-size="10" fill="#5D6D7E">dispatch 异步</text>

    <line x1="1152" y1="740" x2="1188" y2="740" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="1192" y="744" font-size="10" fill="#C0392B">异常/失败</text>

    <rect x="1150" y="752" width="36" height="14" rx="3" fill="url(#gMain)" stroke="#1E8449"/>
    <text x="1192" y="764" font-size="10" fill="#1E8449">主流程节点</text>
  </g>
</svg>
